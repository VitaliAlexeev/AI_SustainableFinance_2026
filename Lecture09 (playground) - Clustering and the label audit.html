    ["MLC", "Socially Responsible Growth", "Ethical", 7.25, 3.41, 3.67, 0.0, 1.87, 0.78, 12.7, 87.79],
    ["Rest", "MySuper Growth", "MySuper", 5.92, 2.19, 2.47, 1.17, 1.34, 0.82, 10.88, 65.48],
    ["Rest", "Sustainable Growth", "Ethical", 0.19, 0.69, 0.33, 0.25, 1.39, 0.49, 3.06, 78.35],
    ["UniSuper", "MySuper Balanced", "MySuper", 2.35, 2.23, 0.61, 1.38, 0.69, 0.88, 7.01, 80.47],
    ["UniSuper", "Sustainable Balanced", "Ethical", 0.18, 2.29, 0.43, 0.0, 1.81, 0.17, 4.53, 89.97],
    ["UniSuper", "Sustainable High Growth", "Ethical", 0.14, 3.12, 0.62, 0.0, 2.55, 0.22, 6.17, 95.39],
    ["Vanguard Super", "MySuper Lifecycle (High Growth)", "MySuper", 5.4, 3.73, 1.18, 1.35, 2.03, 0.86, 12.26, 92.62],
    ["Vanguard Super", "Ethically Conscious Growth", "Ethical", 0.15, 2.76, 0.77, 0.0, 1.13, 0.02, 4.54, 98.32],
  ];
  const DIMS = ["fossil", "human_rights", "env_harm", "social_harm", "animal", "weapons"];
  const DIM_LABEL = {
    fossil: "Fossil fuels", human_rights: "Human rights", env_harm: "Environmental harm",
    social_harm: "Social harm", animal: "Animal cruelty", weapons: "Weapons", total: "Total",
  };
  const DIM_KIND = {
    fossil: "sector", social_harm: "sector", weapons: "sector",
    human_rights: "conduct", env_harm: "mixed", animal: "mixed",
  };
  const SHORT = {
    "Australian Retirement Trust": "ART", "Colonial First State": "CFS", "Vanguard Super": "Vanguard",
    "Mercer Super": "Mercer", "Australian Ethical": "Aust. Ethical", "AustralianSuper": "AustSuper",
  };
  const PANEL = RAW.map((r, i) => {
    const o = { id: i, fund: r[0], option: r[1], type: r[2], total: r[9], disclosure: r[10] };
    DIMS.forEach((d, j) => { o[d] = r[3 + j]; });
    o.name = r[0] + " \u2014 " + r[1];
    o.short = (SHORT[r[0]] || r[0]) + " \u2014 " + r[1];
    o.ethical = r[2] === "Ethical" ? 1 : 0;
    return o;
  });
  const LABEL = PANEL.map((p) => p.ethical);

  // ------------------------------------------------------------------ random
  function rng(seed) {                       // mulberry32
    let a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function randn(r) {
    let u = 0, v = 0;
    while (u === 0) u = r();
    while (v === 0) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function shuffled(arr, r) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ------------------------------------------------------------------ basics
  const sum = (a) => a.reduce((s, v) => s + v, 0);
  const mean = (a) => sum(a) / a.length;
  function percentile(a, q) {               // numpy 'linear'
    const s = a.slice().sort((x, y) => x - y);
    const p = q * (s.length - 1), lo = Math.floor(p), hi = Math.ceil(p);
    return s[lo] + (s[hi] - s[lo]) * (p - lo);
  }
  function column(X, j) { return X.map((r) => r[j]); }
  function dist(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; }
    return Math.sqrt(s);
  }
  function pairwise(X) {
    const n = X.length, D = Array.from({ length: n }, () => new Float64Array(n));
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { D[i][j] = D[j][i] = dist(X[i], X[j]); }
    return D;
  }

  /* Scaling, matching scikit-learn: StandardScaler (ddof 0), MinMaxScaler,
     RobustScaler (median, 25-75 IQR). A zero spread is replaced by 1. */
  function scale(X, how) {
    if (how === "none") return X.map((r) => r.slice());
    const m = X[0].length, centre = [], spread = [];
    for (let j = 0; j < m; j++) {
      const c = column(X, j);
      if (how === "standard") {
        const mu = mean(c), sd = Math.sqrt(mean(c.map((v) => (v - mu) ** 2)));
        centre.push(mu); spread.push(sd > 0 ? sd : 1);
      } else if (how === "minmax") {
        const lo = Math.min(...c), hi = Math.max(...c);
        centre.push(lo); spread.push(hi - lo > 0 ? hi - lo : 1);
      } else if (how === "robust") {
        const iqr = percentile(c, 0.75) - percentile(c, 0.25);
        centre.push(percentile(c, 0.5)); spread.push(iqr > 0 ? iqr : 1);
      } else throw new Error("unknown scaling " + how);
    }
    return X.map((r) => r.map((v, j) => (v - centre[j]) / spread[j]));
  }
  function panelMatrix(dims) { return PANEL.map((p) => dims.map((d) => p[d])); }

  // ------------------------------------------------------------------ k-means
  function assign(X, C) {
    return X.map((x) => {
      let best = 0, bd = Infinity;
      C.forEach((c, k) => { const d = dist(x, c); if (d < bd - 1e-12) { bd = d; best = k; } });
      return best;
    });
  }
  function centroids(X, labels, k, previous) {
    const m = X[0].length;
    const C = Array.from({ length: k }, () => new Array(m).fill(0)), n = new Array(k).fill(0);
    X.forEach((x, i) => { n[labels[i]]++; for (let j = 0; j < m; j++) C[labels[i]][j] += x[j]; });
    return C.map((c, k2) => (n[k2] ? c.map((v) => v / n[k2]) : (previous ? previous[k2].slice() : c)));
  }
  function inertia(X, labels, C) {
    return sum(X.map((x, i) => dist(x, C[labels[i]]) ** 2));
  }
  function initCentroids(X, k, r, method) {
    const n = X.length;
    if (method === "random") return shuffled([...Array(n).keys()], r).slice(0, k).map((i) => X[i].slice());
    const C = [X[Math.floor(r() * n)].slice()];            // k-means++ (D^2 sampling)
    while (C.length < k) {
      const d2 = X.map((x) => Math.min(...C.map((c) => dist(x, c) ** 2)));
      const tot = sum(d2);
      if (tot === 0) { C.push(X[Math.floor(r() * n)].slice()); continue; }
      let u = r() * tot, i = 0;
      while (i < n - 1 && u > d2[i]) { u -= d2[i]; i++; }
      C.push(X[i].slice());
    }
    return C;
  }
  function lloyd(X, C0, maxIter = 300) {
    let C = C0.map((c) => c.slice()), labels = assign(X, C), it = 0;
    const history = [{ C: C.map((c) => c.slice()), labels: labels.slice(), inertia: inertia(X, labels, C) }];
    for (; it < maxIter; it++) {
      const C2 = centroids(X, labels, C.length, C);
      const l2 = assign(X, C2);
      const moved = Math.max(...C.map((c, k) => dist(c, C2[k])));
      C = C2;
      history.push({ C: C.map((c) => c.slice()), labels: l2.slice(), inertia: inertia(X, l2, C) });
      const same = l2.every((v, i) => v === labels[i]);
      labels = l2;
      if (same && moved < 1e-12) break;
    }
    return { labels, C, inertia: inertia(X, labels, C), iterations: history.length - 1, history };
  }
  function kmeans(X, k, opts = {}) {
    const nInit = opts.nInit || 25, r = rng(opts.seed == null ? 42 : opts.seed), init = opts.init || "kmeans++";
    let best = null;
    for (let t = 0; t < nInit; t++) {
      const res = lloyd(X, initCentroids(X, k, r, init));
      if (!best || res.inertia < best.inertia - 1e-9) best = res;
    }
    return best;
  }

  // ------------------------------------------------------------------ silhouette
  /* scikit-learn's definition: a = mean distance to the rest of your own
     cluster, b = smallest mean distance to another cluster, s = (b-a)/max(a,b);
     a point alone in its cluster scores 0. */
  function silhouette(D, labels) {
    const n = labels.length, ks = [...new Set(labels)];
    const out = { s: new Array(n), a: new Array(n), b: new Array(n), nearest: new Array(n) };
    for (let i = 0; i < n; i++) {
      const tot = {}, cnt = {};
      ks.forEach((k) => { tot[k] = 0; cnt[k] = 0; });
      for (let j = 0; j < n; j++) { if (j === i) continue; tot[labels[j]] += D[i][j]; cnt[labels[j]]++; }
      const own = labels[i];
      if (cnt[own] === 0) { out.s[i] = 0; out.a[i] = 0; out.b[i] = NaN; out.nearest[i] = null; continue; }
      const a = tot[own] / cnt[own];
      let b = Infinity, nb = null;
      ks.forEach((k) => { if (k !== own && cnt[k] > 0) { const v = tot[k] / cnt[k]; if (v < b) { b = v; nb = k; } } });
      out.a[i] = a; out.b[i] = b; out.nearest[i] = nb;
      out.s[i] = b === Infinity ? 0 : (b - a) / Math.max(a, b);
    }

// ------------------------------------------------------------------ datasets

function dataPicker(o, onChange) {

// =========================================================== 1. Distance and scaling
registerModule({

registerModule({

    const ctl = h("div", { class: "controls" }, h("label", {}, "Clusters k"), h("div", { class: "row" }, kIn, kOut),
      h("label", {}, "Starting centroids"), initSel, h("label", {}, "Seed"), h("div", { class: "row" }, seedIn, h("button", { class: "btn", onclick: () => { st.seed = 1 + Math.floor(Math.random() * 998); seedIn.value = st.seed; reset(); } }, "New seed")),

    const bStep = h("button", { class: "btn primary", onclick: () => { doAssign(); if (!st.done) doMove(); } }, "One full step");
    const bRun = h("button", { class: "btn", onclick: () => { for (let t = 0; t < 200 && !st.done; t++) { doAssign(false); if (!st.done) doMove(false); } draw(); } }, "Run to the end");
    const bReset = h("button", { class: "btn", onclick: () => reset() }, "Reset");
    const readout = h("div", { class: "readout" });
    function reset() {
      D = dataset(st.spec);
      st.C = L9.initCentroids(D.X, st.k, L9.rng(st.seed), st.init);
      st.labels = null; st.trail = [st.C.map((c) => c.slice())]; st.done = false; st.phase = "start";
      st.hist = []; st.changed = null;
      draw(); restarts(false);
    }
    function doAssign(redraw = true) {
      const l2 = L9.assign(D.X, st.C);
      st.changed = st.labels ? l2.filter((v, i) => v !== st.labels[i]).length : null;
      if (st.labels && st.changed === 0) st.done = true;
      st.labels = l2; st.phase = "assigned";

      if (!st.labels) doAssign(false);
      st.C = L9.centroids(D.X, st.labels, st.k, st.C); st.trail.push(st.C.map((c) => c.slice())); st.phase = "moved";

    function draw() {

      sc.clearLayer("Bg"); sc.clearLayer("Geo"); sc.clearLayer("Top");
      if (!D.pca) {                                  // nearest-centroid regions

        }
      }
      if (st.labels && st.lines) D.disp.forEach((p, i) => sc.line(p, Pc[st.labels[i]], { stroke: colourOf(st.labels[i]), "stroke-width": 1, opacity: 0.45 }));
      st.C.forEach((_, k) => {
        const path = st.trail.map((T) => disp(T[k]));
        if (path.length > 1) s("polyline", { points: path.map((p) => `${sc.sx(p[0])},${sc.sy(p[1])}`).join(" "), fill: "none", stroke: colourOf(k), "stroke-width": 2, "stroke-dasharray": "4 3" }, sc.gGeo);

        h("span", {}, "Points that changed cluster, last assignment"), h("span", {}, st.changed == null ? "\u2013" : st.changed)),
        h("div", { class: "note", html: st.done ? "<strong>Converged.</strong> No point changed cluster, so nothing more can move." : st.phase === "start" ? "Centroids placed. Press <em>Assign points</em> or <em>One full step</em>." : st.phase === "assigned" ? "Every point now belongs to its nearest centroid. Next: move each centroid to the mean of its points." : "Centroids moved to the mean of their points. Some points may now be nearer a different centroid." }));
      bAssign.disabled = bMove.disabled = bStep.disabled = bRun.disabled = st.done;
      const nh = st.hist.length, xt = nh <= 12 ? [...Array(nh).keys()].map((i) => i + 1) : niceTicks(1, nh, 6).ticks.filter(Number.isInteger);
      if (nh) lineChart(c1, { h: 180, series: [{ xs: st.hist.map((_, i) => i + 1), ys: st.hist.map((q) => q.w), dots: true, dotColour: (i) => (st.hist[i].kind === "assign" ? OKABE[0] : OKABE[1]) }], xLabel: "half-step (blue assign, orange move)", yLabel: "sum of squares", xTicks: xt });
      else clear(c1).append(h("div", { class: "cap" }, "The sum of squared distances to the centroids will appear here, one dot per half-step. Watch whether it can ever go up."));
    }
    let lastRestarts = null;
    function restarts(show = true) {
      if (!D) return;
      const r = L9.rng(1000 + st.seed), finals = [];
      for (let t = 0; t < 20; t++) finals.push(L9.lloyd(D.X, L9.initCentroids(D.X, st.k, r, st.init)).inertia);

      if (!show) { clear(c2).append(h("div", { class: "cap" }, "Press 'Twenty starts' to run k-means from twenty different starting positions and compare where each one ends.")); return; }
      lineChart(c2, { h: 180, series: [{ xs: finals.map((_, i) => i + 1), ys: finals, line: false, dots: true, dotColour: (i) => (finals[i] < best + 1e-6 ? OKABE[2] : OKABE[5]) }],
        hlines: [{ y: best, colour: OKABE[2] }], xLabel: `start number (${hit} of 20 reach the lowest)`, yLabel: "final sum of squares", xTicks: [1, 5, 10, 15, 20] });
    }
    const bRestarts = h("button", { class: "btn", onclick: () => restarts(true) }, "Twenty starts");
    sh.work.append(
      h("p", { class: "lede" }, "k-means repeats two moves: give every point to its nearest centroid, then move each centroid to the average of its points. Stop when nothing changes."),
      h("p", { class: "predict" }, "Before you run it: can the sum of squared distances ever increase from one half-step to the next?"),
      picker.el, ctl, h("div", { class: "row" }, bAssign, bMove, bStep, bRun, bReset, bRestarts), readout,
      tryList([
        { q: "Choose <em>Overlapping families</em>, k = 3, random starting points, then press <em>Twenty starts</em>. How many starts reach the lowest sum of squares?",
          a: () => { const X = dataset({ source: "sim", preset: "overlap" }).X, r = L9.rng(4242), f = []; for (let t = 0; t < 20; t++) f.push(L9.lloyd(X, L9.initCentroids(X, 3, r, "random")).inertia); const b = Math.min(...f), n = f.filter((v) => v < b + 1e-6).length; return `<p>From twenty random starts on that preset, ${n} reach the lowest value (${fmt(b, 2)}); the rest stop in a worse local optimum, as high as ${fmt(Math.max(...f), 2)}. That is why real software runs many starts and keeps the best, and why the k-means++ option spreads its starting points out.</p>` + (lastRestarts ? `<p class="muted">Your last run: ${lastRestarts.hit} of 20 reached the lowest value on ${lastRestarts.name}, k = ${lastRestarts.k}, ${lastRestarts.init} starts.</p>` : ""); } },
        { q: "Choose <em>No structure at all</em> and k = 4. Does k-means refuse to answer?",
          a: () => { const X = dataset({ source: "sim", preset: "noise" }).X, km = L9.kmeans(X, 4, { nInit: 20, seed: 3 }), sil = L9.silhouette(L9.pairwise(X), km.labels).mean; return `<p>No. It always returns exactly k groups, and the sum of squares still falls at every step. Nothing in the algorithm asks whether the groups are real. The mean silhouette of this partition is only ${fmt(sil, 2)}; the next screen explains why that number is the warning sign.</p>`; } },
        { q: "Choose <em>Two long bands</em>, k = 2. Where does k-means draw its boundary, and why?",

        { q: "Choose the real panel, all six categories, k = 2, and show the label. Which ethical options sit with the defaults?",
          a: () => { const D2 = dataset({ source: "real", view: "pca", scaling: "standard" }), km = L9.kmeans(D2.X, 2, { nInit: 100, seed: 42 }), lab = canon(km.labels, D2.key); const inHigh = L9.PANEL.filter((p, i) => p.ethical && lab[i] === 1).map((p) => p.short), inLow = L9.PANEL.filter((p, i) => !p.ethical && lab[i] === 0).map((p) => p.short); return `<p>These ethical options land in the higher-exposure cluster:</p>${nameList(inHigh)}<p>and this default lands with the ethical options:</p>${nameList(inLow)}<p>These are the lecture's three false positives and one false negative.</p>`; } },
      ]),
      mathsBox("<p>k-means chooses clusters to minimise the <strong>within-cluster sum of squares</strong>:</p><p class='formula'>W = &Sigma;<sub><i>k</i></sub> &Sigma;<sub><i>i</i> &isin; <i>C<sub>k</sub></i></sub> &#8214;<i>x<sub>i</sub></i> &minus; <i>&mu;<sub>k</sub></i>&#8214;&sup2;</p><p>Assigning each point to its nearest centroid cannot increase W, and moving a centroid to the mean of its points cannot increase W either, because the mean is the point that minimises the sum of squared distances. So W falls, or stays level, at every half-step, and the procedure must stop. It stops at a <strong>local</strong> minimum, which depends on where it started.</p><p><strong>k-means++</strong> picks the first centroid at random and each further one with probability proportional to its squared distance from the nearest centroid already chosen. Starts that are spread out rarely end badly.</p>"),

// =========================================================== 3. Silhouette
registerModule({
  id: "silhouette", short: "Silhouette", title: "Silhouette: is each point closer to its own cluster?",
  build(sh) {
    const st = { spec: { source: "sim", preset: "overlap", show: false }, k: 3, labels: null, sel: null };
    let D = null, Dm = null, curve = null;

    plotBox.append(cap);
    const barBox = h("div", { class: "sheet" }), kBox = h("div", { class: "sheet" });
    sh.sheet.append(plotBox, h("div", { class: "pair" }, barBox, kBox));
    const picker = dataPicker({ initial: st.spec }, (spec, why) => { st.spec = spec; if (why === "data") reset(); else draw(); });

    kIn.oninput = () => { st.k = +kIn.value; kOut.textContent = st.k; partition(); };
    const reassign = h("div", { class: "row" });
    const ctl = h("div", { class: "controls" }, h("label", {}, "Clusters k"), h("div", { class: "row" }, kIn, kOut), h("label", {}, "Move selected to"), reassign);
    const readout = h("div", { class: "readout" });
    function reset() { D = dataset(st.spec); Dm = L9.pairwise(D.X); curve = null; st.sel = null; partition(); }
    function partition() {
      st.labels = canon(L9.kmeans(D.X, st.k, { nInit: D.sim ? 25 : 100, seed: 42 }).labels, D.key);
      draw();
    }
    function draw() {
      const S = L9.silhouette(Dm, st.labels);
      sc.setDomain(D.disp, { equal: D.equal, xLabel: D.xLabel, yLabel: D.yLabel });
      sc.clearLayer("Geo"); sc.clearLayer("Top");

        D.disp.forEach((p, j) => {

          if (st.labels[j] === own) sc.line(D.disp[i], p, { stroke: colourOf(own), "stroke-width": 1.4, opacity: 0.7 });
          else if (st.labels[j] === nb) sc.line(D.disp[i], p, { stroke: colourOf(nb), "stroke-width": 1.2, opacity: 0.6, "stroke-dasharray": "4 3" });
        });
      }
      sc.points(D.disp, { colour: (i) => colourOf(st.labels[i]), shape: (i) => D.shape(i, st.spec.show), ring: (i) => i === st.sel, title: (i) => `${D.names[i]}: s = ${fmt(S.s[i], 2)}` });
      sc.onClick = (i) => { st.sel = i; draw(); };

      if (!curve) { curve = []; for (let k = 2; k <= 8; k++) curve.push(L9.silhouette(Dm, L9.kmeans(D.X, k, { nInit: D.sim ? 12 : 40, seed: 42 }).labels).mean); }
      lineChart(kBox, { h: 200, series: [{ xs: [2, 3, 4, 5, 6, 7, 8], ys: curve, dots: true }], marks: [{ x: st.k, y: curve[st.k - 2], label: "your k" }], xLabel: "number of clusters k", yLabel: "mean silhouette", xTicks: [2, 3, 4, 5, 6, 7, 8] });
      clear(reassign);
      [...Array(st.k).keys()].forEach((k) => reassign.append(h("button", { class: "btn", disabled: st.sel == null || st.labels[st.sel] === k, style: `border-color:${colourOf(k)};color:${colourOf(k)}`, onclick: () => { st.labels = st.labels.slice(); st.labels[st.sel] = k; draw(); } }, String(k + 1))));
      reassign.append(h("button", { class: "btn", onclick: () => partition() }, "Undo moves"));

      else {
        const i = st.sel, a = S.a[i], b = S.b[i];
        readout.append(h("div", {}, h("strong", {}, D.names[i]), " in ", h("span", { class: "chip", style: `background:${colourOf(st.labels[i])}` }), "cluster " + (st.labels[i] + 1)),
          h("div", { class: "kv" }, h("span", {}, "a: mean distance to its own cluster"), h("span", {}, fmt(a, 3)),

          a: () => { const S = L9.silhouette(Dm, st.labels), i = S.s.indexOf(Math.min(...S.s)); return `<p><strong>${D.names[i]}</strong>, with s = ${fmt(S.s[i], 3)}: its mean distance to its own cluster (a = ${fmt(S.a[i], 3)}) is ${S.s[i] < 0 ? "larger" : "barely smaller"} than to cluster ${S.nearest[i] + 1} (b = ${fmt(S.b[i], 3)}). Points on a border, or stranded in the wrong group, score lowest.</p>`; } },
        { q: "Select a well-placed point and move it into a neighbouring cluster with the buttons. What happens to its silhouette?",

        { q: "Choose <em>Families within families</em>. Which k gives the highest mean silhouette? Now show the generating groups: how many are there?",
          a: () => { const D2 = dataset({ source: "sim", preset: "nested" }), M = L9.pairwise(D2.X), c = []; for (let k = 2; k <= 8; k++) c.push(L9.silhouette(M, L9.kmeans(D2.X, k, { nInit: 12, seed: 42 }).labels).mean); const kb = 2 + c.indexOf(Math.max(...c)); return `<p>The mean silhouette peaks at <strong>k = ${kb}</strong> (${fmt(Math.max(...c), 3)}); at k = 4 it is ${fmt(c[2], 3)}. The data were generated from <strong>four</strong> groups, arranged as two pairs. Silhouette rewards the cleanest split it can find, which here is the coarse one. It is a measure of geometric tidiness, not of truth.</p>`; } },
        { q: "Choose the real panel, all six categories. Compare the mean silhouette at k = 2 and k = 3.",

function hull(pts) {                       // Andrew's monotone chain; pts: [[x,y]]
  const P = pts.map((p, i) => [p[0], p[1], i]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);

"use strict";

// =========================================================== 7. ARI
registerModule({
  id: "ari", short: "ARI", title: "ARI: do two groupings agree about which points belong together?",
  build(sh) {
    const st = { spec: { source: "sim", preset: "families", show: true }, k: 3, labels: null, base: null };
    let D = null;
    const plotBox = h("div", { class: "sheet" }), cap = h("div", { class: "cap" });
    const sc = new Scatter(plotBox, { h: 370, label: "partition against the label" });
    plotBox.append(cap);
    const pairBox = h("div", { class: "sheet" }), histBox = h("div", { class: "sheet" });
    sh.sheet.append(plotBox, h("div", { class: "pair" }, pairBox, histBox));
    const picker = dataPicker({ initial: st.spec }, (spec, why) => { st.spec = spec; if (why === "data") reset(); else draw(); });
    const kIn = h("input", { type: "range", min: 2, max: 6, value: st.k }), kOut = h("span", {}, st.k);
    kIn.oninput = () => { st.k = +kIn.value; kOut.textContent = st.k; fromKmeans(); };
    const ctl = h("div", { class: "controls" }, h("label", {}, "Clusters"), h("div", { class: "row" }, kIn, kOut));
    const tableBox = h("div"), readout = h("div", { class: "readout" });
    const r = L9.rng(2718);
    function reset() { D = dataset(st.spec); st.base = null; fromKmeans(); }
    function fromKmeans() { st.labels = canon(L9.kmeans(D.X, st.k, { nInit: D.sim ? 25 : 100, seed: 42 }).labels, D.key); st.base = null; draw(); }
    function fromTruth() { st.labels = D.truth.slice(); st.base = null; draw(); }
    function renumber() {
      const ks = [...new Set(st.labels)], perm = L9.shuffled(ks, r);
      if (ks.length > 1 && perm.every((v, i) => v === ks[i])) perm.push(perm.shift());
      const map = new Map(ks.map((k, i) => [k, perm[i]]));
      st.labels = st.labels.map((l) => map.get(l)); draw();
    }
    function shuffleAll() { st.labels = L9.shuffled(st.labels, r); st.base = null; draw(); }
    function baseline() {
      const a = [], ri = [];
      for (let t = 0; t < 200; t++) { const l = L9.shuffled(st.labels, r); a.push(L9.ari(D.truth, l)); ri.push(L9.randIndex(D.truth, l)); }
      st.base = { a, ri }; draw();
    }
    function draw() {
      const k = Math.max(...st.labels) + 1;
      sc.setDomain(D.disp, { equal: D.equal, xLabel: D.xLabel, yLabel: D.yLabel });
      sc.clearLayer("Geo"); sc.clearLayer("Top");
      sc.points(D.disp, { colour: (i) => colourOf(st.labels[i]), shape: (i) => D.shape(i, st.spec.show), title: (i) => `${D.names[i]}: ${D.truthName(D.truth[i])}, cluster ${st.labels[i] + 1}` });
      sc.onClick = (i) => { st.labels = st.labels.slice(); st.labels[i] = (st.labels[i] + 1) % Math.max(k, st.k); st.base = null; draw(); };
      cap.textContent = "Colour is the partition; shape is " + (D.sim ? "the group that generated each point" : "the label") + ". Click a point to move it to the next cluster.";
      const p = L9.pairCounts(D.truth, st.labels), A = L9.ari(D.truth, st.labels), RI = (p.a + p.b) / p.total;
      const expected = (p.inU * p.inV) / p.total, maxIdx = (p.inU + p.inV) / 2;
      const acc = D.truth.filter((g, i) => g === st.labels[i]).length / D.n;
      clear(tableBox).append(contingencyTable(D.truth, st.labels, { corner: D.sim ? "group" : "", rowName: (g) => D.truthName(g) }));
      clear(readout).append(h("div", { class: "big" }, "ARI " + fmt(A, 3)),
        h("div", { class: "kv" },
          h("span", {}, "Rand index: share of pairs the two agree on"), h("span", {}, fmt(RI, 3)),
          h("span", {}, "Pairs together in both, expected by chance"), h("span", {}, fmt(expected, 1)),
          h("span", {}, "Pairs together in both, actually"), h("span", {}, p.a),
          h("span", {}, "Normalised mutual information"), h("span", {}, fmt(L9.nmi(D.truth, st.labels), 3)),
          h("span", {}, "Naive accuracy, if cluster j means group j"), h("span", {}, pct(acc, 0))),
        h("div", { class: "note", html: `ARI = (${p.a} &minus; ${fmt(expected, 1)}) / (${fmt(maxIdx, 1)} &minus; ${fmt(expected, 1)}): how far the actual agreement is above chance, as a share of the most it could be.` }));
      // ---- pair bar
      const w = 330, hh = 200, svg = s("svg", { viewBox: `0 0 ${w} ${hh}`, role: "img", "aria-label": "pairs of points" }, clear(pairBox));
      const parts = [["together in both", p.a, OKABE[2]], ["apart in both", p.b, OKABE[4]], [D.sim ? "together in the group only" : "together in the label only", p.c, OKABE[5]], ["together in the partition only", p.d, OKABE[1]]];
      let x = 12;
      parts.forEach(([t, v, c]) => { const wd = ((w - 24) * v) / p.total; s("rect", { x, y: 18, width: Math.max(0, wd), height: 30, fill: c }, svg); x += wd; });
      parts.forEach(([t, v, c], i) => {
        s("rect", { x: 12, y: 66 + i * 24, width: 12, height: 12, fill: c }, svg);
        s("text", { x: 30, y: 76 + i * 24, style: "fill:var(--text)" }, svg).textContent = `${t}: ${v} pairs`;
      });
      s("text", { x: 12, y: 12, style: "font-size:11px" }, svg).textContent = `all ${p.total} pairs of ${D.unit}`;
      s("text", { x: 12, y: hh - 8, style: "font-size:11px" }, svg).textContent = "Green and blue agree; red and orange disagree.";
      // ---- chance baseline
      if (st.base) histogram(histBox, { values: st.base.a, domain: [-0.3, 1], bins: 26, marks: [{ x: A, label: "yours " + fmt(A, 2) }], xLabel: `ARI of 200 shuffles (Rand index averaged ${fmt(L9.mean(st.base.ri), 2)})`, colour: "var(--default)", h: 200, w: 330 });
      else clear(histBox).append(h("div", { class: "cap" }, "Press 'Build the chance baseline' to shuffle this partition 200 times, keeping the cluster sizes, and see what agreement looks like by pure chance."));
    }
    sh.work.append(
      h("p", { class: "lede" }, "Cluster numbers are arbitrary, so you cannot score a partition by asking whether cluster 1 equals group 1. The adjusted Rand index looks at pairs instead: for every pair of points, do the two groupings agree on whether they belong together?"),
      h("p", { class: "predict" }, "Before you press anything: if you renumber the clusters, which of the numbers on the right will change?"),
      picker.el, ctl,
      h("div", { class: "row" }, h("button", { class: "btn", onclick: fromKmeans }, "Start from k-means"), h("button", { class: "btn", onclick: fromTruth }, "Start from the truth"), h("button", { class: "btn", onclick: renumber }, "Renumber the clusters"), h("button", { class: "btn", onclick: shuffleAll }, "Shuffle the assignments"), h("button", { class: "btn primary", onclick: baseline }, "Build the chance baseline")),
      tableBox, readout,
      tryList([
        { q: "Make the ARI exactly 1 without pressing <em>Start from the truth</em>.",
          a: "<p>Click points until every cluster contains exactly one group and every group sits in exactly one cluster. The colours do not have to match the shapes in any particular way: any one-to-one pairing of clusters with groups scores 1, because the same pairs are together.</p>" },
        { q: "Press <em>Renumber the clusters</em> a few times. Which number moves: the naive accuracy or the ARI?",
          a: "<p>Only the naive accuracy. Renumbering changes which cluster is called 1, but not which points are together, so every pair count, the Rand index, the ARI and the NMI stay exactly where they were. That is why clustering is scored with pair-based measures and never with accuracy.</p>" },
        { q: "Press <em>Shuffle the assignments</em>, then <em>Build the chance baseline</em>. Why is the Rand index still well above zero?",
          a: () => { const l = L9.shuffled(st.labels, L9.rng(11)), ri = [], a = []; for (let t = 0; t < 200; t++) { const q = L9.shuffled(l, L9.rng(100 + t)); ri.push(L9.randIndex(D.truth, q)); a.push(L9.ari(D.truth, q)); } return `<p>For random partitions of the data on screen, the Rand index averages ${fmt(L9.mean(ri), 2)} and the ARI averages ${fmt(L9.mean(a), 3)}. Most pairs are apart in both groupings simply because most pairs are in different groups, so the raw Rand index gets a large score for free. The adjustment subtracts what chance alone would deliver.</p>`; } },
        { q: "Can you make the ARI negative?",
          a: () => { const g = D.truth, seen = {}, l = g.map((gi) => { seen[gi] = (seen[gi] || 0) + 1; return (seen[gi] - 1) % st.k; }); return `<p>Yes. Spread every group evenly across all the clusters, so that points which belong together are systematically kept apart. For the data on screen with ${st.k} clusters, that gives an ARI of ${fmt(L9.ari(g, l), 3)}: below zero means less agreement than chance.</p>`; } },
        { q: "Choose the real panel, all six categories, 2 clusters, and start from k-means. Read the table.",
          a: () => { const D2 = dataset({ source: "real", view: "pca", scaling: "standard" }), l = canon(L9.kmeans(D2.X, 2, { nInit: 100, seed: 42 }).labels, D2.key); const { table } = L9.contingency(L9.LABEL, l); return `<p>MySuper defaults: ${table[0][0]} in the low-exposure cluster, ${table[0][1]} in the high. Ethical options: ${table[1][0]} low, ${table[1][1]} high. ARI ${fmt(L9.ari(L9.LABEL, l), 3)}, the lecture's number. The four off-diagonal options are the whole story: three ethical options that look like defaults, and one default from an ethical provider.</p>`; } },
      ]),
      mathsBox("<p>For every pair of points, the label and the partition each say <em>together</em> or <em>apart</em>. With <i>a</i> pairs together in both and <i>b</i> apart in both, out of <i>N</i> pairs, the <strong>Rand index</strong> is (<i>a</i> + <i>b</i>) / <i>N</i>.</p><p>The <strong>adjusted</strong> version compares <i>a</i> with its expected value if the partition were shuffled at random, keeping the cluster sizes (Hubert and Arabie, 1985):</p><p class='formula'>ARI = (<i>a</i> &minus; E[<i>a</i>]) / (&frac12;(<i>P<sub>L</sub></i> + <i>P<sub>C</sub></i>) &minus; E[<i>a</i>]), &nbsp; E[<i>a</i>] = <i>P<sub>L</sub></i> <i>P<sub>C</sub></i> / <i>N</i></p><p>where <i>P<sub>L</sub></i> and <i>P<sub>C</sub></i> count the pairs together under the label and under the partition. ARI is 1 for identical groupings, about 0 for chance, and can be negative. It works when the numbers of clusters and groups differ.</p>"),
      sh.nav());
    reset();
  },
});

// =========================================================== 8. The audit
registerModule({
  id: "audit", short: "The audit", title: "Run the audit: cluster without the label, then look",
  build(sh) {
    const st = { feats: new Set(L9.DIMS), scaling: "standard", method: "kmeans", k: 2, revealed: false, grid: null };
    const plotBox = h("div", { class: "sheet" }), cap = h("div", { class: "cap" });
    const sc = new Scatter(plotBox, { h: 380, label: "the super panel" });
    plotBox.append(cap);
    const gridBox = h("div", { class: "sheet" }), freqBox = h("div", { class: "sheet" });
    sh.sheet.append(plotBox, h("div", { class: "pair" }, gridBox, freqBox));
    const P = pcaFixed(), disp = P.scores, key = L9.PANEL.map((p) => p.total);
    const featBox = h("div", { class: "row" });
    L9.DIMS.forEach((d) => {
      const cb = h("input", { type: "checkbox" }); cb.checked = true;
      cb.onchange = () => { if (cb.checked) st.feats.add(d); else st.feats.delete(d); if (!st.feats.size) { st.feats.add(d); cb.checked = true; } st.grid = null; draw(); };
      featBox.append(h("label", { class: "check" }, cb, L9.DIM_LABEL[d]));
    });
    const scSel = h("select"); ["standard", "minmax", "robust", "none"].forEach((k) => scSel.append(h("option", { value: k }, SCALE_NAME[k])));
    scSel.onchange = () => { st.scaling = scSel.value; draw(); };
    const mSel = h("select"); [["kmeans", "k-means"], ["ward", "Ward"], ["complete", "complete linkage"], ["average", "average linkage"]].forEach(([v, t]) => mSel.append(h("option", { value: v }, t)));
    mSel.onchange = () => { st.method = mSel.value; draw(); };
    const kIn = h("input", { type: "range", min: 2, max: 5, value: 2 }), kOut = h("span", {}, 2);
    kIn.oninput = () => { st.k = +kIn.value; kOut.textContent = st.k; draw(); };
    const ctl = h("div", { class: "controls" }, h("label", {}, "Features"), featBox, h("label", {}, "Scaling"), scSel, h("label", {}, "Method"), mSel, h("label", {}, "Clusters"), h("div", { class: "row" }, kIn, kOut));
    const bReveal = h("button", { class: "btn primary", onclick: () => { st.revealed = !st.revealed; draw(); } }, "Reveal the label");
    const bGrid = h("button", { class: "btn", onclick: () => { st.grid = runGrid(); draw(); } }, "Run all sixteen pipelines");
    const result = h("div", { class: "readout" });
    const feats = () => L9.DIMS.filter((d) => st.feats.has(d));
    function partitionFor(method, scaling, k) {
      const X = L9.scale(L9.panelMatrix(feats()), scaling);
      const lab = method === "kmeans" ? L9.kmeans(X, k, { nInit: 100, seed: 42 }).labels : L9.cutTree(L9.linkage(X, method), 31, k);
      return canon(lab, key);
    }
    function runGrid() {
      const methods = ["kmeans", "ward", "complete", "average"], scalings = ["standard", "minmax", "robust", "none"];
      const vals = methods.map(() => scalings.map(() => 0)), freq = new Map(L9.PANEL.filter((p) => p.ethical).map((p) => [p.id, 0]));
      methods.forEach((m, i) => scalings.forEach((sg, j) => {
        const lab = partitionFor(m, sg, 2);
        vals[i][j] = L9.ari(L9.LABEL, lab);
        const cnt = [0, 0]; lab.forEach((l, t) => { if (!L9.LABEL[t]) cnt[l]++; });
        const dc = cnt[1] >= cnt[0] ? 1 : 0;
        lab.forEach((l, t) => { if (L9.LABEL[t] && l === dc) freq.set(t, freq.get(t) + 1); });
      }));
      return { vals, methods, scalings, freq };
    }
    function draw() {
      const lab = partitionFor(st.method, st.scaling, st.k);
      sc.setDomain(disp, { equal: true, xLabel: `PC1: general harm exposure (${Math.round(100 * P.ratio[0])}%)`, yLabel: `PC2: human rights and animal welfare (${Math.round(100 * P.ratio[1])}%)` });
      sc.clearLayer("Geo"); sc.clearLayer("Top");
      sc.points(disp, { colour: (i) => colourOf(lab[i]), shape: (i) => (st.revealed ? (L9.LABEL[i] ? "circle" : "cross") : "circle"), title: (i) => L9.PANEL[i].short + (st.revealed ? (L9.LABEL[i] ? ", ethical option" : ", MySuper default") : "") + `, cluster ${lab[i] + 1}` });
      cap.textContent = "The map never moves: it is the first two principal components of all six categories. Clusters are numbered from the lowest mean exposure upwards." + (st.revealed ? " Circles are ethical options, crosses are defaults." : " The label is hidden.");
      bReveal.textContent = st.revealed ? "Hide the label" : "Reveal the label";
      clear(result);
      const f = feats();
      result.append(h("div", { class: "note" }, `Pipeline: ${f.length === 6 ? "all six categories" : f.map((d) => L9.DIM_LABEL[d]).join(", ")}; ${SCALE_NAME[st.scaling]}; ${st.method === "kmeans" ? "k-means" : st.method + " linkage"}; ${st.k} clusters.`));
      if (!st.revealed) result.append(h("div", { class: "note" }, "The algorithm has not seen the label. Decide what you expect, then reveal it."));
      else {
        const sizes = {}; lab.forEach((l) => { sizes[l] = (sizes[l] || 0) + 1; });
        const cnt = {}; lab.forEach((l, t) => { if (!L9.LABEL[t]) cnt[l] = (cnt[l] || 0) + 1; });
        const dc = +Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
        const ethWithDefaults = L9.PANEL.filter((p, t) => p.ethical && lab[t] === dc).map((p) => p.short);
        const defaultsElsewhere = L9.PANEL.filter((p, t) => !p.ethical && lab[t] !== dc).map((p) => p.short);
        result.append(h("div", { class: "big" }, "ARI " + fmt(L9.ari(L9.LABEL, lab), 3)),
          contingencyTable(L9.LABEL, lab, { rowName: (g) => (g ? "ethical option" : "MySuper default") }),
          h("div", { class: "note", html: `<strong>Ethical options in the cluster holding most defaults:</strong>${nameList(ethWithDefaults)}<strong>Defaults outside it:</strong>${nameList(defaultsElsewhere)}` }));
      }
      if (st.grid) {
        const g = st.grid;
        clear(gridBox).append(h("div", { class: "cap" }, "Adjusted Rand index against the label, two clusters, your features"),
          heatTable(g.vals, ["k-means", "Ward", "complete", "average"], ["standard", "min\u2013max", "robust", "raw"]),
          h("div", { class: "cap" }, `Range ${fmt(Math.min(...g.vals.flat()), 2)} to ${fmt(Math.max(...g.vals.flat()), 2)}.`));
        const rows = [...g.freq.entries()].sort((a, b) => b[1] - a[1]), w = 330, hh = 26 + rows.length * 15;
        const svg = s("svg", { viewBox: `0 0 ${w} ${hh}`, role: "img", "aria-label": "how often each ethical option sits with the defaults" }, clear(freqBox));
        s("text", { x: 6, y: 13, style: "font-size:11px" }, svg).textContent = "Times each ethical option sits with the defaults, of 16";
        rows.forEach(([id, v], r2) => {
          const y = 22 + r2 * 15, bw = (v / 16) * 120;
          s("text", { x: 190, y: y + 9, "text-anchor": "end", style: "font-size:9.5px;fill:var(--text)" }, svg).textContent = L9.PANEL[id].short.length > 34 ? L9.PANEL[id].short.slice(0, 33) + "\u2026" : L9.PANEL[id].short;
          s("rect", { x: 196, y, width: Math.max(1, bw), height: 11, fill: v === 16 ? "var(--flag)" : "var(--default)" }, svg);
          s("text", { x: 200 + bw, y: y + 9, style: "font-size:9.5px" }, svg).textContent = v;
        });
      } else {
        clear(gridBox).append(h("div", { class: "cap" }, "Press 'Run all sixteen pipelines' to score every combination of four methods and four scalings against the label, using the features you have ticked."));
        clear(freqBox).append(h("div", { class: "cap" }, "The same run counts how often each ethical option lands with the defaults. A verdict that survives sixteen pipelines is a finding."));
      }
    }
    sh.work.append(
      h("p", { class: "lede" }, "Everything together, on the real panel. Choose what the algorithm may look at and how, cluster the 31 options, and only then reveal the label and score the result."),
      h("p", { class: "predict" }, "Pre-register: before you reveal anything, write down your pipeline and the ARI you expect."),
      ctl, h("div", { class: "row" }, bReveal, bGrid), result,
      tryList([
        { q: "Untick everything except fossil fuels and social harm, then reveal. What happens to the ARI, and why?",
          a: () => { const X = L9.scale(L9.panelMatrix(["fossil", "social_harm"]), "standard"), l = L9.kmeans(X, 2, { nInit: 100, seed: 42 }).labels; return `<p>With k-means on those two standardised categories the ARI is ${fmt(L9.ari(L9.LABEL, l), 3)}, against 0.535 with all six. These are two of the sector screens the label is built on, so an algorithm that looks only at them recovers the label more closely.</p>`; } },
        { q: "Now keep only human rights and animal cruelty.",
          a: () => { const X = L9.scale(L9.panelMatrix(["human_rights", "animal"]), "standard"), l = L9.kmeans(X, 2, { nInit: 100, seed: 42 }).labels; return `<p>The ARI falls to ${fmt(L9.ari(L9.LABEL, l), 3)}. On the conduct and welfare categories, the ones members say they care about most, the ethical label leaves almost no trace in the holdings.</p>`; } },
        { q: "Tick all six categories and run all sixteen pipelines. Which ethical option sits with the defaults every time?",
          a: () => { const saved = new Set(st.feats); st.feats = new Set(L9.DIMS); const g = runGrid(); st.feats = saved; const top = [...g.freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, v]) => `${L9.PANEL[id].short}: ${v} of 16`); return `<p>ARI ranges from ${fmt(Math.min(...g.vals.flat()), 2)} to ${fmt(Math.max(...g.vals.flat()), 2)} across the sixteen pipelines, but the most robust outlier does not move:</p>${nameList(top)}<p>The identity of the outlier is far more stable than the ARI. That is the finding worth reporting, and the reason to publish the whole grid rather than its best cell.</p>`; } },
      ]),
      h("p", { class: "muted" }, "k-means uses k-means++ starts and keeps the best of 100, with a fixed seed, so the numbers match the lecture and Lab 9a."),
      sh.nav());
    draw();
  },
});

boot();

</script>
